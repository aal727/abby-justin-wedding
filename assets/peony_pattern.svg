<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Tileable peony pattern: tone-on-tone mint (#d4ebe1) on the header mint (#e7f7f0).
       Petals are separated by thin strokes in the background color. -->
  <defs>
    <g id="peony" fill="#d4ebe1" stroke="#e7f7f0" stroke-width="1.6" stroke-linejoin="round">
      <!-- leaves -->
      <path d="M-6 22 C -26 26, -38 40, -40 48 C -28 48, -12 40, -6 22 Z"/>
      <path d="M6 22 C 24 22, 36 32, 40 40 C 28 44, 12 38, 6 22 Z"/>
      <path d="M-36 45 L -10 27" fill="none"/>
      <path d="M36 38 L 10 26" fill="none"/>
      <!-- outer petals -->
      <g>
        <path d="M0 0 C -14 -6, -16 -24, -8 -30 C -4 -33, 4 -33, 8 -30 C 16 -24, 14 -6, 0 0 Z"/>
        <path d="M0 0 C -14 -6, -16 -24, -8 -30 C -4 -33, 4 -33, 8 -30 C 16 -24, 14 -6, 0 0 Z" transform="rotate(51.4)"/>
        <path d="M0 0 C -14 -6, -16 -24, -8 -30 C -4 -33, 4 -33, 8 -30 C 16 -24, 14 -6, 0 0 Z" transform="rotate(102.8)"/>
        <path d="M0 0 C -14 -6, -16 -24, -8 -30 C -4 -33, 4 -33, 8 -30 C 16 -24, 14 -6, 0 0 Z" transform="rotate(154.2)"/>
        <path d="M0 0 C -14 -6, -16 -24, -8 -30 C -4 -33, 4 -33, 8 -30 C 16 -24, 14 -6, 0 0 Z" transform="rotate(205.6)"/>
        <path d="M0 0 C -14 -6, -16 -24, -8 -30 C -4 -33, 4 -33, 8 -30 C 16 -24, 14 -6, 0 0 Z" transform="rotate(257)"/>
        <path d="M0 0 C -14 -6, -16 -24, -8 -30 C -4 -33, 4 -33, 8 -30 C 16 -24, 14 -6, 0 0 Z" transform="rotate(308.4)"/>
      </g>
      <!-- inner ruffled petals -->
      <g transform="rotate(25)">
        <path d="M0 0 C -10 -4, -11 -16, -5 -19 C -2 -21, 2 -21, 5 -19 C 11 -16, 10 -4, 0 0 Z"/>
        <path d="M0 0 C -10 -4, -11 -16, -5 -19 C -2 -21, 2 -21, 5 -19 C 11 -16, 10 -4, 0 0 Z" transform="rotate(72)"/>
        <path d="M0 0 C -10 -4, -11 -16, -5 -19 C -2 -21, 2 -21, 5 -19 C 11 -16, 10 -4, 0 0 Z" transform="rotate(144)"/>
        <path d="M0 0 C -10 -4, -11 -16, -5 -19 C -2 -21, 2 -21, 5 -19 C 11 -16, 10 -4, 0 0 Z" transform="rotate(216)"/>
        <path d="M0 0 C -10 -4, -11 -16, -5 -19 C -2 -21, 2 -21, 5 -19 C 11 -16, 10 -4, 0 0 Z" transform="rotate(288)"/>
      </g>
      <!-- center -->
      <circle r="7"/>
      <path d="M-4 -1 C -2 -4, 2 -4, 4 -1 M-3 3 C -1 1, 1 1, 3 3" fill="none"/>
    </g>
    <g id="bud" fill="#d4ebe1" stroke="#e7f7f0" stroke-width="1.4" stroke-linejoin="round">
      <path d="M0 18 C -2 8, -1 0, 0 -6" fill="none" stroke="#d4ebe1" stroke-width="2"/>
      <path d="M0 -4 C -8 -6, -9 -16, -4 -20 C -2 -22, 2 -22, 4 -20 C 9 -16, 8 -6, 0 -4 Z"/>
      <path d="M0 8 C -8 8, -13 2, -13 -2 C -6 -2, -2 2, 0 8 Z"/>
      <path d="M0 4 C 7 4, 11 -1, 12 -5 C 5 -5, 1 -1, 0 4 Z"/>
    </g>
  </defs>
  <use href="#peony" transform="translate(48 46) rotate(-12)"/>
  <use href="#peony" transform="translate(134 132) rotate(18) scale(0.82)"/>
  <use href="#bud" transform="translate(140 42) rotate(20)"/>
  <use href="#bud" transform="translate(42 140) rotate(-25)"/>
</svg>
